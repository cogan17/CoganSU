name: Hapus branch

# One-off (owner, 5 Nov 2026: "gunakan workflow sekali jalan"): deletes work branches whose PR is
# already merged. Removed again from main after it has run. A branch is only deleted when it has no
# open PR and its current head is exactly the head of a merged PR, so no unmerged work is lost.
#
# Sekali jalan: hapus branch kerja yang PR-nya sudah digabung. Branch dengan PR terbuka atau commit
# yang belum digabung tidak disentuh.

on:
  workflow_dispatch:
    inputs:
      branches:
        description: "Branch, pisah spasi / space separated"
        type: string
        default: "ccr-344ab142-dnm7nc docs/checkpoint-4nov-malam fix/batas-sertifikat fix/kartu-cogan-kernel"
      dry_run:
        description: "Cek saja, tanpa menghapus / check only"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: read

jobs:
  hapus:
    name: Hapus / delete
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      BRANCHES: ${{ inputs.branches }}
      DRY_RUN: ${{ inputs.dry_run }}
      DEFAULT: ${{ github.event.repository.default_branch }}
    steps:
      - name: Hapus branch / delete branches
        run: |
          set -eu
          owner=${REPO%%/*}
          fail=0
          {
            echo "## Hapus branch / Delete branches"
            echo
            echo "| Branch | Hasil / Result |"
            echo "|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          for b in $BRANCHES; do
            note=""
            if [ "$b" = "$DEFAULT" ]; then
              note="❌ branch utama, tidak dihapus / default branch, kept"
            elif ! sha=$(gh api "repos/$REPO/branches/$b" --jq .commit.sha 2>/dev/null); then
              note="➖ tidak ada / not found"
            elif [ -n "$(gh api "repos/$REPO/pulls?state=open&head=$owner:$b" --jq '.[].number')" ]; then
              note="❌ masih ada PR terbuka, tidak dihapus / open PR, kept"
            elif [ -z "$(gh api --paginate "repos/$REPO/pulls?state=closed&head=$owner:$b" \
                --jq ".[] | select(.merged_at != null and .head.sha == \"$sha\") | .number")" ]; then
              note="❌ commit terakhir belum digabung, tidak dihapus / head not merged, kept"
            elif [ "$DRY_RUN" = true ]; then
              note="🔎 akan dihapus / would be deleted (\`${sha:0:7}\`)"
            elif gh api -X DELETE "repos/$REPO/git/refs/heads/$b" > /dev/null; then
              note="✅ dihapus / deleted (\`${sha:0:7}\`)"
            else
              note="❌ gagal dihapus / delete failed"
            fi
            case "$note" in ❌*) fail=1 ;; esac
            echo "$b: $note"
            echo "| \`$b\` | $note |" >> "$GITHUB_STEP_SUMMARY"
          done
          exit "$fail"
