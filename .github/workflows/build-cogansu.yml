# Build CoganSU: ksud (arm64) and the CoganSU manager APK, signed with the CoganSU release key.
# Manual only (owner: save Actions runs). Form like Cogan Kernel's Builder (owner 2026-11-04):
# Release Type CI = artifacts only; Pre-Release/Release publish this run at the end (only from main and
# with kernel/cogansu.mk matching). Build Revision rN names the release vYY.MM.DD-rN (UTC date), empty =
# the run number. An existing tag is never replaced here: use a new Build Revision, or "timpa" in
# Rilis dari run. Artifacts: the APK as it is (unarchived) and build-info (build.env).
# Every build on main first merges the newest KernelSU main into CoganSU and pushes that merge (owner
# 2026-11-07: "jika saya build otomatis akan mengupdate dari KSU"), so CoganSU never lags KernelSU and only
# waits when KernelSU/SUSFS themselves wait (scripts/gabung_kernelsu.py).
#
# Membangun CoganSU: ksud (arm64) dan APK manager CoganSU, ditandatangani kunci rilis CoganSU.
# Release Type CI = artifact saja; Pre-Release/Release langsung terbit. Build Revision rN = nama rilis.
# Setiap build dari main lebih dulu menggabung KernelSU main terbaru secara otomatis.
name: Build CoganSU

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release Type (CI = artifact saja / only)"
        type: choice
        default: "CI"
        options:
          - "CI"
          - "Pre-Release"
          - "Release"
      build_revision:
        description: "Build Revision: r10 · kosong / empty = nomor run / run number"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: build-cogansu
  cancel-in-progress: false

env:
  UPSTREAM: https://github.com/tiann/KernelSU.git
  SUSFS: https://gitlab.com/simonpunk/susfs4ksu.git
  SUSFS_BRANCH: gki-android14-6.1

jobs:
  sync:
    name: KernelSU terbaru / newest KernelSU
    runs-on: ubuntu-latest
    permissions:
      contents: write   # pushes the automatic KernelSU merge to main
    outputs:
      sha: ${{ steps.sync.outputs.sha }}
    steps:
      - name: Periksa isian / check the form
        env:
          RELEASE_TYPE: ${{ inputs.release_type }}
          REVISION: ${{ inputs.build_revision }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          [[ -z "$REVISION" || "$REVISION" =~ ^r[0-9]+$ ]] || { echo "::error::Build Revision: r + angka, mis. r10 / r followed by digits"; exit 1; }
          if [ "$RELEASE_TYPE" != "CI" ]; then
            [ "$GITHUB_REF_NAME" = "$DEFAULT_BRANCH" ] \
              || { echo "::error::$RELEASE_TYPE hanya dari / only from $DEFAULT_BRANCH"; exit 1; }
          fi

      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Gabung KernelSU main / merge KernelSU main
        id: sync
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git fetch --no-tags "$UPSTREAM" '+refs/heads/main:refs/remotes/upstream/main'
          git fetch -q --no-tags --depth=1 "$SUSFS" "+refs/heads/$SUSFS_BRANCH:refs/check/susfs" \
            || echo "::warning::SUSFS tidak terbaca / could not be read"
          git config user.name Cogan
          git config user.email 79615344+cogan17@users.noreply.github.com
          merge=(); [ "$GITHUB_REF_NAME" = "$DEFAULT_BRANCH" ] && merge=(--merge)
          python3 scripts/gabung_kernelsu.py "${merge[@]}" --out "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"
          if grep -q '^merged=yes$' "$GITHUB_OUTPUT"; then
            # GITHUB_TOKEN may not push upstream commits that change .github/workflows, nor to a protected
            # branch: then a person merges KernelSU main once (a PR), and the next build goes on by itself.
            git push origin "HEAD:refs/heads/$GITHUB_REF_NAME" || {
              echo "::error::Gabung KernelSU main tidak bisa di-push (GitHub menolak: commit hulu mengubah .github/workflows atau main terlindungi). Gabungkan KernelSU main sekali lewat PR, lalu build lagi / the merge could not be pushed; merge KernelSU main once through a PR, then build again"
              exit 1
            }
          fi

  ksud:
    name: ksud (arm64)
    needs: sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.sync.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Upstream tags (version name)
        # Only upstream's vX.Y.Z tags, so "git describe" reads v3.3.1-N-g<commit> and not a CoganSU release tag.
        run: |
          git tag -l | xargs -r git tag -d >/dev/null
          git fetch --no-tags "$UPSTREAM" 'refs/tags/v*:refs/tags/v*'

      - name: Setup rustup
        run: |
          rustup update stable
          rustup target add aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: userspace/ksud
          cache-targets: false

      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r29

      - name: Build ksud
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          source .github/scripts/setup-rust-build.sh aarch64-linux-android 26
          cargo build --target "$TRIPLE" --release --manifest-path ./userspace/ksud/Cargo.toml

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: ksud-aarch64
          path: target/aarch64-linux-android/release/ksud

  manager:
    name: CoganSU manager
    needs: [sync, ksud]
    runs-on: ubuntu-latest
    env:
      RELEASE_TYPE: ${{ inputs.release_type }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.sync.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Upstream tags (version name) and main
        # Only upstream's vX.Y.Z tags, so "git describe" reads v3.3.1-N-g<commit> and not a CoganSU release tag.
        run: |
          git tag -l | xargs -r git tag -d >/dev/null
          git fetch --no-tags "$UPSTREAM" 'refs/tags/v*:refs/tags/v*' '+refs/heads/main:refs/remotes/upstream/main'

      - name: Signing key / Kunci tanda tangan
        id: key
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            {
              echo "## ❌ Kunci tanda tangan belum ada"
              echo "Isi secret \`KEYSTORE\`, \`KEYSTORE_PASSWORD\`, \`KEY_ALIAS\` dan \`KEY_PASSWORD\` (lihat [docs/kunci.md](../blob/${GITHUB_REF_NAME}/docs/kunci.md))."
              echo
              echo "## ❌ Signing key missing"
              echo "Set the \`KEYSTORE\`, \`KEYSTORE_PASSWORD\`, \`KEY_ALIAS\` and \`KEY_PASSWORD\` secrets (see docs/kunci.en.md)."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Signing key secrets are missing (docs/kunci.md)"
            exit 1
          fi
          printf '%s' "$KEYSTORE" | base64 -d > manager/key.jks
          {
            echo "KEYSTORE_FILE=key.jks"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
          } >> manager/gradle.properties
          python3 scripts/cogansu_cert.py keystore manager/key.jks "$KEY_ALIAS" >> "$GITHUB_OUTPUT"

      - name: Certificate vs kernel/cogansu.mk / Sertifikat vs kernel
        id: cert
        run: |
          state="$(python3 scripts/cogansu_cert.py check '${{ steps.key.outputs.size }}' '${{ steps.key.outputs.hash }}' || true)"
          echo "state=$state" >> "$GITHUB_OUTPUT"
          if [ "$state" = mismatch ]; then
            {
              echo "## ❌ Kunci berbeda dengan kernel"
              echo "Sertifikat kunci ini (\`${{ steps.key.outputs.size }}\` \`${{ steps.key.outputs.hash }}\`) tidak sama dengan \`kernel/cogansu.mk\`. Kernel tidak akan mengenali manager ini. Jangan mengganti kunci rilis."
              echo
              echo "## ❌ Key differs from the kernel"
              echo "This key's certificate does not match \`kernel/cogansu.mk\`; the kernel would not accept this manager. Do not change the release key."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Signing certificate does not match kernel/cogansu.mk"
            exit 1
          fi
          if [ "$RELEASE_TYPE" != "CI" ] && [ "$state" != match ]; then
            echo "::error::$RELEASE_TYPE: kernel/cogansu.mk belum diisi; build CI dulu / not filled in yet; build CI first"
            exit 1
          fi

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - uses: actions/download-artifact@v8.0.2
        with:
          name: ksud-aarch64
          path: ksud-aarch64

      - name: Build APK
        working-directory: ./manager
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp ../ksud-aarch64/ksud app/src/main/jniLibs/arm64-v8a/libksud.so
          ./gradlew clean assembleRelease

      - name: Check the APK / Cek APK
        id: apk
        run: |
          apk="$(ls manager/app/build/outputs/apk/release/*.apk)"
          [ "$(echo "$apk" | wc -l)" = 1 ] || { echo "::error::expected one APK: $apk"; exit 1; }
          unzip -l "$apk" | grep -q 'lib/arm64-v8a/libksud.so' || { echo "::error::libksud.so missing from the APK"; exit 1; }
          python3 scripts/cogansu_cert.py apk "$apk" > apk-cert.txt
          [ "$(sed -n 's/^size=//p' apk-cert.txt)" = '${{ steps.key.outputs.size }}' ] \
            && [ "$(sed -n 's/^hash=//p' apk-cert.txt)" = '${{ steps.key.outputs.hash }}' ] \
            || { echo "::error::the APK is not signed (v2) with the release key"; exit 1; }
          name="$(basename "$apk")"
          code="$(echo "$name" | sed -n 's/.*_\([0-9]\+\)-release\.apk$/\1/p')"
          {
            echo "path=$apk"
            echo "name=$name"
            echo "code=$code"
            echo "version=$(git describe --tags --always)"
          } >> "$GITHUB_OUTPUT"

      - name: Build info
        id: info
        env:
          REVISION: ${{ inputs.build_revision }}
          STATE: ${{ steps.cert.outputs.state }}
          SIZE: ${{ steps.key.outputs.size }}
          HASH: ${{ steps.key.outputs.hash }}
          APK: ${{ steps.apk.outputs.path }}
          VERSION: ${{ steps.apk.outputs.version }}
          CODE: ${{ steps.apk.outputs.code }}
        run: |
          set -euo pipefail
          revision="${REVISION:-r$GITHUB_RUN_NUMBER}"
          release="v$(date -u +%y.%m.%d)-$revision"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          mkdir -p build-info
          {
            echo "RELEASE=$release"
            echo "RELEASE_NAME=CoganSU $release"
            echo "VERSION=$VERSION"
            echo "CODE=$CODE"
            echo "COMMIT=$(git rev-parse HEAD)"
            echo "PACKAGE=com.cogan.su"
            echo "APK=$(basename "$APK")"
            echo "APK_SHA256=$(sha256sum "$APK" | cut -d' ' -f1)"
            echo "CERT_SIZE=$SIZE"
            echo "CERT_HASH=$HASH"
            echo "CERT_STATE=$STATE"
            echo "UPSTREAM_COMMIT=$(git merge-base HEAD upstream/main)"
          } > build-info/build.env
          cat build-info/build.env

      # The APK as it is (no ZIP around it): Rilis dari run downloads it and checks its digest.
      - uses: actions/upload-artifact@v7.0.1
        with:
          path: ${{ steps.apk.outputs.path }}
          archive: false
          retention-days: 90

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: build-info
          path: build-info/build.env
          retention-days: 90

      - name: Summary / Ringkasan
        env:
          STATE: ${{ steps.cert.outputs.state }}
          SIZE: ${{ steps.key.outputs.size }}
          HASH: ${{ steps.key.outputs.hash }}
          NAME: ${{ steps.apk.outputs.name }}
          VERSION: ${{ steps.apk.outputs.version }}
          CODE: ${{ steps.apk.outputs.code }}
          RELEASE: ${{ steps.info.outputs.release }}
          COMMIT: ${{ needs.sync.outputs.sha }}
        run: |
          case "$STATE" in
            match) kid="✅ cocok dengan \`kernel/cogansu.mk\`"; ken="✅ matches \`kernel/cogansu.mk\`" ;;
            *) kid="⚠️ \`kernel/cogansu.mk\` masih kosong: isi dengan nilai di atas (\`python3 scripts/cogansu_cert.py write $SIZE $HASH\`), lalu build ulang"
               ken="⚠️ \`kernel/cogansu.mk\` is still empty: store the values above in it, then build again" ;;
          esac
          {
            echo "## CoganSU $RELEASE · $VERSION ($CODE)"
            echo
            echo "| | Indonesia | English |"
            echo "|---|---|---|"
            echo "| Rilis / Release | \`$RELEASE\` ($RELEASE_TYPE) | \`$RELEASE\` ($RELEASE_TYPE) |"
            echo "| APK | \`$NAME\` | \`$NAME\` |"
            echo "| Paket / Package | \`com.cogan.su\` | \`com.cogan.su\` |"
            echo "| Commit | \`${COMMIT::12}\` | \`${COMMIT::12}\` |"
            echo "| Sertifikat / Certificate | \`$SIZE\` \`$HASH\` | \`$SIZE\` \`$HASH\` |"
            echo "| Kernel | $kid | $ken |"
            echo
            if [ "$RELEASE_TYPE" != CI ]; then
              echo "- 🇮🇩 Rilis diterbitkan oleh job *Terbit* di run ini."
              echo "- 🇬🇧 The release is published by this run's *Terbit* job."
            elif [ "$STATE" = match ] && [ "$GITHUB_REF_NAME" = main ]; then
              echo "- 🇮🇩 Untuk merilis nanti: jalankan **Rilis dari run** dengan run_id \`$GITHUB_RUN_ID\`."
              echo "- 🇬🇧 To release later: run **Rilis dari run** with run_id \`$GITHUB_RUN_ID\`."
            else
              echo "- 🇮🇩 Run ini tidak bisa dirilis (harus dari main dan \`kernel/cogansu.mk\` cocok)."
              echo "- 🇬🇧 This run cannot be released (it must be from main with \`kernel/cogansu.mk\` matching)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Terbit / publish (${{ inputs.release_type }})
    needs: [sync, manager]
    if: ${{ inputs.release_type != 'CI' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TYPE: ${{ inputs.release_type }}
      UPSTREAM: https://github.com/tiann/KernelSU.git
      COMMIT: ${{ needs.sync.outputs.sha }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.sync.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: KernelSU main (pembanding / for comparison)
        run: git fetch --no-tags "$UPSTREAM" '+refs/heads/main:refs/remotes/upstream/main'

      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: "CoganSU_*.apk"
          path: files
          merge-multiple: true
          skip-decompress: true

      - uses: actions/download-artifact@v8.0.2
        with:
          name: build-info
          path: info

      - name: Terbitkan rilis / publish the release
        run: |
          set -euo pipefail
          tag="$(sed -n 's/^RELEASE=//p' info/build.env)"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Rilis $tag sudah ada; tidak ditimpa di sini. Pakai Build Revision baru, atau Rilis dari run dengan timpa / release $tag exists; use a new Build Revision, or Rilis dari run with timpa"
            exit 1
          fi
          python3 scripts/release_from_run.py info files --repo "$GITHUB_REPOSITORY" --sha "$COMMIT" \
            --telegram telegram --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > notes.md
          title="$(sed -n 's/^RELEASE_NAME=//p' info/release.env)"
          (cd files && sha256sum -- * > checksums.txt)
          mode=(--prerelease); [ "$RELEASE_TYPE" = "Release" ] && mode=(--latest)
          gh release create "$tag" files/* --repo "$GITHUB_REPOSITORY" --target "$COMMIT" "${mode[@]}" \
            --title "$title" --notes-file notes.md
          {
            echo "## Rilis / release: [$tag]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$tag) ($RELEASE_TYPE)"
            echo
            echo "## 📣 Telegram · ID/EN"
            echo
            cat telegram/summary.md
            echo
            echo '<details><summary>📝 Catatan rilis / Release notes</summary>'
            echo
            cat notes.md
            echo
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"
