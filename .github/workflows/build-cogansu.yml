# Build CoganSU: ksud (arm64) and the CoganSU manager APK, signed with the CoganSU release key.
# Manual only (owner: save Actions runs). It never publishes: a green run of main is released with
# "Rilis dari run" (like Cogan Kernel). Artifacts: the APK as it is (unarchived) and build-info (build.env).
#
# Membangun CoganSU: ksud (arm64) dan APK manager CoganSU, ditandatangani kunci rilis CoganSU.
# Hanya manual dan tidak menerbitkan apa pun; run hijau dari main dirilis lewat "Rilis dari run".
name: Build CoganSU

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-cogansu
  cancel-in-progress: false

env:
  UPSTREAM: https://github.com/tiann/KernelSU.git

jobs:
  ksud:
    name: ksud (arm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Upstream tags (version name)
        # Only upstream's vX.Y.Z tags, so "git describe" reads v3.3.1-N-g<commit> and not a CoganSU release tag.
        run: |
          git tag -l | xargs -r git tag -d >/dev/null
          git fetch --no-tags "$UPSTREAM" 'refs/tags/v*:refs/tags/v*'

      - name: Setup rustup
        run: |
          rustup update stable
          rustup target add aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: userspace/ksud
          cache-targets: false

      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r29

      - name: Build ksud
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          source .github/scripts/setup-rust-build.sh aarch64-linux-android 26
          cargo build --target "$TRIPLE" --release --manifest-path ./userspace/ksud/Cargo.toml

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: ksud-aarch64
          path: target/aarch64-linux-android/release/ksud

  manager:
    name: CoganSU manager
    needs: ksud
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Upstream tags (version name) and main
        # Only upstream's vX.Y.Z tags, so "git describe" reads v3.3.1-N-g<commit> and not a CoganSU release tag.
        run: |
          git tag -l | xargs -r git tag -d >/dev/null
          git fetch --no-tags "$UPSTREAM" 'refs/tags/v*:refs/tags/v*' '+refs/heads/main:refs/remotes/upstream/main'

      - name: Signing key / Kunci tanda tangan
        id: key
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            {
              echo "## ❌ Kunci tanda tangan belum ada"
              echo "Isi secret \`KEYSTORE\`, \`KEYSTORE_PASSWORD\`, \`KEY_ALIAS\` dan \`KEY_PASSWORD\` (lihat [docs/kunci.md](../blob/${GITHUB_REF_NAME}/docs/kunci.md))."
              echo
              echo "## ❌ Signing key missing"
              echo "Set the \`KEYSTORE\`, \`KEYSTORE_PASSWORD\`, \`KEY_ALIAS\` and \`KEY_PASSWORD\` secrets (see docs/kunci.en.md)."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Signing key secrets are missing (docs/kunci.md)"
            exit 1
          fi
          printf '%s' "$KEYSTORE" | base64 -d > manager/key.jks
          {
            echo "KEYSTORE_FILE=key.jks"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
          } >> manager/gradle.properties
          python3 scripts/cogansu_cert.py keystore manager/key.jks "$KEY_ALIAS" >> "$GITHUB_OUTPUT"

      - name: Certificate vs kernel/cogansu.mk / Sertifikat vs kernel
        id: cert
        run: |
          state="$(python3 scripts/cogansu_cert.py check '${{ steps.key.outputs.size }}' '${{ steps.key.outputs.hash }}' || true)"
          echo "state=$state" >> "$GITHUB_OUTPUT"
          if [ "$state" = mismatch ]; then
            {
              echo "## ❌ Kunci berbeda dengan kernel"
              echo "Sertifikat kunci ini (\`${{ steps.key.outputs.size }}\` \`${{ steps.key.outputs.hash }}\`) tidak sama dengan \`kernel/cogansu.mk\`. Kernel tidak akan mengenali manager ini. Jangan mengganti kunci rilis."
              echo
              echo "## ❌ Key differs from the kernel"
              echo "This key's certificate does not match \`kernel/cogansu.mk\`; the kernel would not accept this manager. Do not change the release key."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Signing certificate does not match kernel/cogansu.mk"
            exit 1
          fi

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - uses: actions/download-artifact@v8.0.2
        with:
          name: ksud-aarch64
          path: ksud-aarch64

      - name: Build APK
        working-directory: ./manager
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp ../ksud-aarch64/ksud app/src/main/jniLibs/arm64-v8a/libksud.so
          ./gradlew clean assembleRelease

      - name: Check the APK / Cek APK
        id: apk
        run: |
          apk="$(ls manager/app/build/outputs/apk/release/*.apk)"
          [ "$(echo "$apk" | wc -l)" = 1 ] || { echo "::error::expected one APK: $apk"; exit 1; }
          unzip -l "$apk" | grep -q 'lib/arm64-v8a/libksud.so' || { echo "::error::libksud.so missing from the APK"; exit 1; }
          python3 scripts/cogansu_cert.py apk "$apk" > apk-cert.txt
          [ "$(sed -n 's/^size=//p' apk-cert.txt)" = '${{ steps.key.outputs.size }}' ] \
            && [ "$(sed -n 's/^hash=//p' apk-cert.txt)" = '${{ steps.key.outputs.hash }}' ] \
            || { echo "::error::the APK is not signed (v2) with the release key"; exit 1; }
          name="$(basename "$apk")"
          code="$(echo "$name" | sed -n 's/.*_\([0-9]\+\)-release\.apk$/\1/p')"
          {
            echo "path=$apk"
            echo "name=$name"
            echo "code=$code"
            echo "version=$(git describe --tags --always)"
          } >> "$GITHUB_OUTPUT"

      - name: Build info
        env:
          STATE: ${{ steps.cert.outputs.state }}
          SIZE: ${{ steps.key.outputs.size }}
          HASH: ${{ steps.key.outputs.hash }}
          APK: ${{ steps.apk.outputs.path }}
          VERSION: ${{ steps.apk.outputs.version }}
          CODE: ${{ steps.apk.outputs.code }}
        run: |
          mkdir -p build-info
          {
            echo "VERSION=$VERSION"
            echo "CODE=$CODE"
            echo "COMMIT=$GITHUB_SHA"
            echo "PACKAGE=com.cogan.su"
            echo "APK=$(basename "$APK")"
            echo "APK_SHA256=$(sha256sum "$APK" | cut -d' ' -f1)"
            echo "CERT_SIZE=$SIZE"
            echo "CERT_HASH=$HASH"
            echo "CERT_STATE=$STATE"
            echo "UPSTREAM_COMMIT=$(git merge-base HEAD upstream/main)"
          } > build-info/build.env
          cat build-info/build.env

      # The APK as it is (no ZIP around it): Rilis dari run downloads it and checks its digest.
      - uses: actions/upload-artifact@v7.0.1
        with:
          path: ${{ steps.apk.outputs.path }}
          archive: false
          retention-days: 90

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: build-info
          path: build-info/build.env
          retention-days: 90

      - name: Summary / Ringkasan
        env:
          STATE: ${{ steps.cert.outputs.state }}
          SIZE: ${{ steps.key.outputs.size }}
          HASH: ${{ steps.key.outputs.hash }}
          NAME: ${{ steps.apk.outputs.name }}
          VERSION: ${{ steps.apk.outputs.version }}
          CODE: ${{ steps.apk.outputs.code }}
        run: |
          case "$STATE" in
            match) kid="✅ cocok dengan \`kernel/cogansu.mk\`"; ken="✅ matches \`kernel/cogansu.mk\`" ;;
            *) kid="⚠️ \`kernel/cogansu.mk\` masih kosong: isi dengan nilai di atas (\`python3 scripts/cogansu_cert.py write $SIZE $HASH\`), lalu build ulang"
               ken="⚠️ \`kernel/cogansu.mk\` is still empty: store the values above in it, then build again" ;;
          esac
          {
            echo "## CoganSU $VERSION ($CODE)"
            echo
            echo "| | Indonesia | English |"
            echo "|---|---|---|"
            echo "| APK | \`$NAME\` | \`$NAME\` |"
            echo "| Paket / Package | \`com.cogan.su\` | \`com.cogan.su\` |"
            echo "| Commit | \`${GITHUB_SHA::12}\` | \`${GITHUB_SHA::12}\` |"
            echo "| Sertifikat / Certificate | \`$SIZE\` \`$HASH\` | \`$SIZE\` \`$HASH\` |"
            echo "| Kernel | $kid | $ken |"
            echo
            if [ "$STATE" = match ] && [ "$GITHUB_REF_NAME" = main ]; then
              echo "- 🇮🇩 Untuk merilis: jalankan **Rilis dari run** dengan run_id \`$GITHUB_RUN_ID\`."
              echo "- 🇬🇧 To release: run **Rilis dari run** with run_id \`$GITHUB_RUN_ID\`."
            else
              echo "- 🇮🇩 Run ini tidak bisa dirilis (harus dari main dan \`kernel/cogansu.mk\` cocok)."
              echo "- 🇬🇧 This run cannot be released (it must be from main with \`kernel/cogansu.mk\` matching)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
